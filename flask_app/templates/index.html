{% extends 'base.html' %}
{% block title %}Inicio - Donaciones de Peluches{% endblock %}
{% block content %}
<div class="row justify-content-center g-4">
    <div class="col-md-6">
        <div class="card card-app">
            <div class="card-header header-primary">
                <h4 class="mb-0">Registro</h4>
            </div>
            <div class="card-body">
                <form action="/registro" method="POST" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" maxlength="50"
                               value="{{ reg_data.nombre if reg_data else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" name="apellido" class="form-control" maxlength="50"
                               value="{{ reg_data.apellido if reg_data else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" maxlength="100"
                               value="{{ reg_data.email if reg_data else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" name="confirmar" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary-action w-100">Crear cuenta</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card card-app">
            <div class="card-header header-secondary">
                <h4 class="mb-0">Inicio de sesión</h4>
            </div>
            <div class="card-body">
                <form action="/login" method="POST" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ login_email if login_email else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-secondary-action w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
